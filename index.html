<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <main class="squares">

        <div class="squares__box squares__box--left">
            <div class="squares__square"></div>
            <div class="squares__square"></div>
            <div class="squares__square"></div>
        </div>

        <div class="squares__box squares__box--center">
            <div class="squares__square squares__square--tall"></div>         
            <div class="squares__square squares__square--tall"></div>
            <div class="squares__square squares__square--tall"></div>        
        </div>

       
        <div class="squares__box squares__box--right">
            <div class="squares__square"></div>
            <div class="squares__square"></div>
            <div class="squares__square"></div>
        </div>

      
        <div class="squares__box squares__box--spread">
            <div class="squares__square squares__square--top"></div>
            <div class="squares__square squares__square--center"></div>
            <div class="squares__square squares__square--bottom"></div>
        </div>

      
        <div class="squares__box squares__box--center">
            <div class="squares__square squares__square--tall"> <p>Laura</p></div>
            <div class="squares__square squares__square--short"> <p>Makes</p> </div>
            <div class="squares__square squares__square--tall"> <p>Boxes</p> </div>
        </div>

       <div class="squares__box squares__box--center">
           <div class="squares__square"></div>
           <div class="squares__square squares__square--wide"></div>
           <div class="squares__square"></div>
        </div>

    </main>

</body>
</html>
